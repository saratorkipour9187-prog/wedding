<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#efe8df" />
  <title>دعوت‌نامه عروسی مهسا و میلاد</title>
  <meta name="description" content="با افتخار و صمیمانه، شما را به جشن عروسی مهسا و میلاد دعوت می‌کنیم." />

  <meta property="og:title" content="دعوت‌نامه عروسی مهسا و میلاد 🤍" />
  <meta property="og:description" content="برای مشاهده دعوت‌نامه وارد شوید." />
  <meta property="og:type" content="website" />

  <style>
    :root {
      --cream: #f8f3ec;
      --ink: #362d2a;
      --gold: #b68a56;
      --line: rgba(182,138,86,.35);
      --glass: rgba(255,255,255,.62);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,.9), transparent 30%),
        radial-gradient(circle at 85% 10%, rgba(223,203,180,.55), transparent 32%),
        linear-gradient(145deg, #fbf8f3 0%, #efe4d7 100%);
      overflow-x: hidden;
    }

    body::before, body::after {
      content: "";
      position: fixed;
      width: 240px;
      height: 240px;
      border: 1px solid var(--line);
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
    }
    body::before { top: -110px; right: -90px; }
    body::after { bottom: -120px; left: -100px; }

    .petal {
      position: fixed;
      top: -40px;
      width: 10px;
      height: 16px;
      background: rgba(255,255,255,.85);
      border-radius: 60% 40% 60% 40%;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,.05));
      animation: fall linear infinite;
      z-index: 1;
      pointer-events: none;
    }
    @keyframes fall {
      to { transform: translate3d(var(--drift), 110vh, 0) rotate(540deg); }
    }

    .page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
    }

    .card {
      width: min(94vw, 560px);
      padding: 38px 22px 28px;
      text-align: center;
      background: var(--glass);
      border: 1px solid rgba(255,255,255,.75);
      border-radius: 30px;
      box-shadow: 0 24px 70px rgba(79,59,42,.16);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: rise .9s ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .monogram {
      width: 74px;
      height: 74px;
      margin: 0 auto 18px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: Georgia, serif;
      color: var(--gold);
      font-size: 25px;
      letter-spacing: 2px;
    }

    .eyebrow {
      font-size: 13px;
      letter-spacing: 3px;
      color: #846b57;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 9vw, 58px);
      font-weight: 500;
      line-height: 1.15;
    }

    .heart {
      color: var(--gold);
      font-size: .64em;
      vertical-align: 12%;
      margin: 0 6px;
    }

    .divider {
      width: 110px;
      height: 1px;
      margin: 22px auto;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .invite {
      margin: 0 auto 22px;
      max-width: 380px;
      line-height: 2;
      font-size: 16px;
      color: #5f4d43;
    }

    .play-btn {
      appearance: none;
      border: 0;
      cursor: pointer;
      padding: 15px 28px;
      border-radius: 999px;
      font-size: 16px;
      color: white;
      background: linear-gradient(135deg, #c39a68, #9d7042);
      box-shadow: 0 14px 30px rgba(157,112,66,.25);
      transition: .25s ease;
    }
    .play-btn:hover { transform: translateY(-2px); }
    .play-btn:active { transform: scale(.98); }

    .note {
      margin-top: 16px;
      font-size: 12px;
      color: #8c7b70;
    }

    .video-wrap {
      display: none;
      margin-top: 24px;
      overflow: hidden;
      border-radius: 20px;
      background: #000;
      box-shadow: 0 16px 45px rgba(0,0,0,.16);
      aspect-ratio: 9 / 16;
    }

    .video-wrap.show {
      display: block;
      animation: reveal .5s ease both;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #8d7d72;
    }

    @media (max-width: 420px) {
      .card { padding: 32px 16px 22px; border-radius: 25px; }
      .invite { font-size: 15px; }
    }
  </style>
</head>

<body>
  <div id="petals"></div>

  <main class="page">
    <section class="card">
      <div class="monogram">M&M</div>
      <div class="eyebrow">WEDDING INVITATION</div>

      <h1>مهسا <span class="heart">♥</span> میلاد</h1>

      <div class="divider"></div>

      <p class="invite">
        با افتخار و صمیمانه،<br>
        شما را به جشن آغاز زندگی مشترکمان دعوت می‌کنیم.
      </p>

      <button class="play-btn" id="playBtn" type="button">
        ▶ مشاهده دعوت‌نامه
      </button>

      <div class="video-wrap" id="videoWrap">
        <iframe
          id="videoFrame"
          title="دعوت‌نامه عروسی مهسا و میلاد"
          allow="autoplay; fullscreen"
          allowfullscreen
          loading="lazy">
        </iframe>
      </div>

      <div class="note">برای پخش ویدیو روی دکمه بالا بزنید</div>
      <div class="footer">با عشق، منتظر دیدارتان هستیم 🤍</div>
    </section>
  </main>

  <script>
    const fileId = "1O3-LN2OZVa2brKf0-BMvHSEhUv96Kdef";
    const btn = document.getElementById("playBtn");
    const wrap = document.getElementById("videoWrap");
    const frame = document.getElementById("videoFrame");

    btn.addEventListener("click", () => {
      frame.src = `https://drive.google.com/file/d/${fileId}/preview`;
      wrap.classList.add("show");
      btn.style.display = "none";
      wrap.scrollIntoView({ behavior: "smooth", block: "center" });
    });

    const petals = document.getElementById("petals");
    for (let i = 0; i < 12; i++) {
      const p = document.createElement("span");
      p.className = "petal";
      p.style.left = Math.random() * 100 + "vw";
      p.style.opacity = (0.35 + Math.random() * 0.5).toFixed(2);
      p.style.animationDuration = (9 + Math.random() * 8) + "s";
      p.style.animationDelay = (-Math.random() * 12) + "s";
      p.style.setProperty("--drift", (Math.random() * 120 - 60) + "px");
      petals.appendChild(p);
    }
  </script>
</body>
</html>
