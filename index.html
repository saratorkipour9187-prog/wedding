<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#efe6db">
  <title>دعوت‌نامه عروسی مهسا و میلاد</title>
  <style>
    :root{
      --cream:#fbf8f3;
      --cream2:#eadbc9;
      --gold:#b98649;
      --text:#4c3a30;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}
    body{
      color:var(--text);
      background:
        radial-gradient(circle at 88% 8%,rgba(204,164,115,.18) 0 16%,transparent 17%),
        radial-gradient(circle at 10% 92%,rgba(204,164,115,.12) 0 18%,transparent 19%),
        linear-gradient(145deg,var(--cream),var(--cream2));
      overflow-x:hidden;
    }
    .page{
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:28px 16px;
    }
    .card{
      width:min(680px,100%);
      background:rgba(255,255,255,.78);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,.7);
      border-radius:34px;
      box-shadow:0 20px 60px rgba(91,68,45,.15);
      padding:42px 24px 30px;
      text-align:center;
      position:relative;
      overflow:hidden;
    }
    .card:before,.card:after{
      content:"";
      position:absolute;
      width:180px;height:180px;
      border:1px solid rgba(185,134,73,.35);
      border-radius:50%;
      pointer-events:none;
    }
    .card:before{right:-95px;top:-90px}
    .card:after{left:-110px;bottom:-105px}
    .monogram{
      width:92px;height:92px;
      border:1.5px solid var(--gold);
      border-radius:50%;
      display:grid;
      place-items:center;
      margin:0 auto 22px;
      font-family:Georgia,serif;
      color:var(--gold);
      font-size:30px;
      letter-spacing:1px;
    }
    .eyebrow{
      letter-spacing:7px;
      font-weight:700;
      font-size:14px;
      margin-bottom:28px;
    }
    h1{
      margin:0;
      font-size:clamp(34px,7vw,54px);
      font-weight:600;
      line-height:1.25;
    }
    .heart{color:var(--gold);font-size:.65em;vertical-align:middle;padding:0 8px}
    .rule{
      width:150px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);
      margin:28px auto;
    }
    .lead{font-size:18px;line-height:2;margin:0 0 24px}
    .open-btn{
      border:0;
      background:linear-gradient(135deg,#d29c59,#a96f31);
      color:white;
      font-weight:800;
      font-size:18px;
      border-radius:999px;
      padding:16px 30px;
      min-width:250px;
      box-shadow:0 10px 25px rgba(169,111,49,.28);
      cursor:pointer;
    }
    .hint{margin:18px 0 0;font-size:14px;opacity:.72}
    .footer{margin-top:26px;font-size:15px;opacity:.78}
    .video-wrap{
      display:none;
      margin-top:28px;
      animation:fade .35s ease;
    }
    .video-wrap.show{display:block}
    video{
      width:100%;
      max-height:75svh;
      border-radius:22px;
      background:#000;
      box-shadow:0 14px 35px rgba(0,0,0,.22);
    }
    @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="monogram">M&amp;M</div>
      <div class="eyebrow">WEDDING INVITATION</div>

      <h1>مهسا <span class="heart">♥</span> میلاد</h1>
      <div class="rule"></div>

      <p class="lead">
        با افتخار و صمیمانه،<br>
        شما را به جشن آغاز زندگی مشترکمان دعوت می‌کنیم.
      </p>

      <button class="open-btn" id="openBtn" type="button">▶ مشاهده دعوت‌نامه</button>
      <p class="hint">برای پخش ویدیو روی دکمه بالا بزنید</p>

      <div class="video-wrap" id="videoWrap">
        <video id="weddingVideo" controls playsinline preload="metadata">
          <source src="./MahsaMilad_web.mp4" type="video/mp4">
          مرورگر شما از پخش ویدیو پشتیبانی نمی‌کند.
        </video>
      </div>

      <div class="footer">با عشق، منتظر دیدارتان هستیم 🤍</div>
    </section>
  </main>

  <script>
    const btn = document.getElementById('openBtn');
    const wrap = document.getElementById('videoWrap');
    const video = document.getElementById('weddingVideo');

    btn.addEventListener('click', async () => {
      wrap.classList.add('show');
      btn.style.display = 'none';
      wrap.scrollIntoView({behavior:'smooth', block:'center'});
      try { await video.play(); } catch (e) {}
    });
  </script>
</body>
</html>
